name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction (ideally with fanferro.testing.memory_client or MiniStack)
      render: python
  - type: input
    id: versions
    attributes:
      label: fanferro, Python and OS versions
      placeholder: fanferro 0.1.0, Python 3.13, Linux aarch64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / events
      render: text
