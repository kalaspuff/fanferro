name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_LOCKED: "1"
  # aws-lc (TLS) needs NASM on Windows x86-64 unless its prebuilt objects are used.
  AWS_LC_SYS_PREBUILT_NASM: "1"
  # Build tools, pinned to the versions the dev container uses (update together).
  MATURIN_VERSION: "1.15.0"
  ZIG_VERSION: "0.17.0"

jobs:
  lint:
    name: Lint, types and docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: uv sync
      - run: uv run ruff format --check python tests examples scripts
      - run: uv run ruff check python tests examples scripts
      - run: uv run pyrefly check
      - run: uv run python scripts/check_consistency.py
      - name: Lint workflows
        run: uvx --from actionlint-py actionlint

  rust:
    name: Rust tests (incl. MiniStack end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
      - run: cargo test --workspace
      - name: Start MiniStack
        run: |
          uvx --from ministack ministack > ministack.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:4566/_ministack/health > /dev/null && exit 0; sleep 1; done
          echo "::error::MiniStack did not become healthy"; cat ministack.log; exit 1
      - run: cargo test -p fanferro-core --test aws_emulator
        env:
          FANFERRO_TEST_ENDPOINT_URL: http://localhost:4566
      - if: failure()
        run: cat ministack.log

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync
      - name: Tests (unit, integration on memory + MiniStack, e2e)
        run: uv run pytest --cov=fanferro --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  other-platforms:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Tests without the emulator
        run: uv run pytest -m "not e2e" -k "not ministack"

  package:
    name: Packaging (sdist + cross-built wheels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx --from "maturin==$MATURIN_VERSION" maturin sdist --out dist
      - name: Cross-build an aarch64 musl wheel with zig (as the release does)
        run: uvx --from "maturin==$MATURIN_VERSION" --with "ziglang==$ZIG_VERSION" maturin build --locked --zig --target aarch64-unknown-linux-musl --compatibility musllinux_1_2 --out dist
      - run: ls -l dist
