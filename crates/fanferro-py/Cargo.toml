[package]
name = "fanferro-py"
description = "Python bindings for fanferro (built with maturin into fanferro._core)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
# Covered by the Python test suite; a Rust test harness would have to link libpython.
test = false
doctest = false

[dependencies]
fanferro-core.workspace = true
futures.workspace = true
pyo3.workspace = true
pythonize.workspace = true
bytes.workspace = true
parking_lot.workspace = true
time.workspace = true
tokio.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
