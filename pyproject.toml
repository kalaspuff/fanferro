[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "fanferro"
description = "Fast, robust SNS + SQS messaging for Python, powered by a Rust core: fan-out, envelopes, claim checks, heartbeats, DLQs, routing and OpenTelemetry."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carl Oscar Aaro", email = "hello@carloscar.com" }]
keywords = ["sqs", "sns", "aws", "messaging", "queue", "pubsub", "asyncio", "rust", "cloudevents", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.7"]
protobuf = ["protobuf>=5.27"]
msgspec = ["msgspec>=0.18.6"]
otel = ["opentelemetry-api>=1.25"]
all = ["pydantic>=2.7", "protobuf>=5.27", "msgspec>=0.18.6", "opentelemetry-api>=1.25"]

[project.urls]
Homepage = "https://github.com/kalaspuff/fanferro"
Documentation = "https://github.com/kalaspuff/fanferro/tree/main/docs"
Repository = "https://github.com/kalaspuff/fanferro"
Issues = "https://github.com/kalaspuff/fanferro/issues"
Changelog = "https://github.com/kalaspuff/fanferro/blob/main/CHANGELOG.md"

[project.scripts]
fanferro = "fanferro.__main__:main"

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "pytest-cov>=7",
    "hypothesis>=6.140",
    "ministack>=1.5.26",
    "boto3>=1.40",
    "pydantic>=2.7",
    "protobuf>=5.27",
    "msgspec>=0.18.6",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "uvloop>=0.21; sys_platform != 'win32'",
]
lint = ["ruff>=0.17", "pyrefly>=1.3"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "maturin>=1.15,<2"]

[tool.uv]
default-groups = ["dev"]
# Rebuild the native extension when Rust sources change (`uv run` keeps it fresh).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.maturin]
manifest-path = "crates/fanferro-py/Cargo.toml"
python-source = "python"
module-name = "fanferro._core"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python", "tests", "examples"]
extend-exclude = ["target", ".ministack"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade (modern syntax for 3.12+)
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "PIE",      # misc lints
    "RET",      # return statements
    "PERF",     # performance
    "FURB",     # refurb
    "TC",       # type-checking imports
    "PYI",      # stub style
    "N",        # naming
    "D",        # docstrings (public API)
    "BLE",      # blind except
    "T20",      # print statements
    "LOG",      # logging
    "G",        # logging format
    "S",        # security (bandit)
    "ANN",      # annotations
    "TRY",      # exception handling
    "PGH",      # pygrep hooks
    "FA",       # future annotations
]
ignore = [
    "D105",    # magic method docstrings
    "D107",    # __init__ docstrings (documented on the class)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # Any is sometimes the honest type (codecs, hooks)
    "TRY003",  # long messages in exceptions are helpful
    "S101",    # assert is used for invariants
    "S311",    # random is used for jitter, not crypto
    "TC006",   # quoting cast() targets is noise
    "ASYNC109", # `timeout` parameters are part of the public API (e.g. extend(timeout))
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PLR2004", "T20", "BLE001", "TRY", "N802", "PERF", "TC"]
"examples/**" = ["D", "T20", "S", "ANN", "BLE001", "TRY", "TC", "PT"]
"scripts/**" = ["T20", "S", "D", "ANN"]
"python/fanferro/_core.pyi" = ["D", "PYI021", "N818"]
"python/fanferro/codecs/_*.py" = ["D102"]  # protocol implementations are documented on Codec
"python/fanferro/testing.py" = ["D102"]
"python/fanferro/__main__.py" = ["T20"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true

[tool.pyrefly]
project-includes = ["python", "tests", "examples", "scripts"]
python-version = "3.12"
search-path = ["python", "scripts"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
timeout = 180
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "e2e: end-to-end tests against an AWS-compatible emulator (MiniStack); started automatically unless FANFERRO_TEST_ENDPOINT_URL is set",
]
filterwarnings = ["error", "ignore::DeprecationWarning:botocore.*", "ignore::DeprecationWarning:google.*"]

[tool.coverage.run]
source = ["fanferro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]
